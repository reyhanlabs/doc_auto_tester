name: Nightly Zahir ERP Tests

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: DEBUG - lihat struktur folder
        run: |
          echo "Lokasi saat ini:"
          pwd
          echo ""
          echo "Isi folder root repo:"
          ls -la
          echo ""
          echo "Cari folder yang namanya mengandung 'zahir':"
          find . -maxdepth 1 -iname "*zahir*"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: erp.zahir.dev
        run: npm install

      - name: Install Playwright browser
        working-directory: erp.zahir.dev
        run: npx playwright install --with-deps chromium

      - name: Siapkan .env dari GitHub Secrets
        working-directory: erp.zahir.dev
        run: |
          echo "BASE_URL=https://erp.zahir.dev/" >> .env
          echo "ZAHIR_USERNAME=${{ secrets.ZAHIR_USERNAME }}" >> .env
          echo "ZAHIR_PASSWORD=${{ secrets.ZAHIR_PASSWORD }}" >> .env
          echo "ZAHIR_COMPANY_NAME=${{ secrets.ZAHIR_COMPANY_NAME }}" >> .env

      - name: Jalankan semua test
        working-directory: erp.zahir.dev
        run: npx playwright test
        continue-on-error: true

      - name: Upload laporan HTML (selalu, walau ada yang gagal)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: erp.zahir.dev/reports/html/
          retention-days: 14

      - name: Upload screenshot/trace kalau ada yang gagal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: erp.zahir.dev/test-results/
          retention-days: 14
